<h1>Student Enrollment Form</h1>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

  <label>Student Name</label>

  <input
    type="text"
    name="studentName"
    [(ngModel)]="studentName"
    required
    minlength="3"
    #nameCtrl="ngModel">

  <div *ngIf="nameCtrl.touched">

    <small *ngIf="nameCtrl.errors?.['required']">
      Name is required.
    </small>

    <small *ngIf="nameCtrl.errors?.['minlength']">
      Name must contain at least 3 characters.
    </small>

  </div>

  <br><br>

  <label>Email</label>

  <input
    type="email"
    name="studentEmail"
    [(ngModel)]="studentEmail"
    required
    email
    #emailCtrl="ngModel">

  <div *ngIf="emailCtrl.touched">

    <small *ngIf="emailCtrl.errors?.['required']">
      Email is required.
    </small>

    <small *ngIf="emailCtrl.errors?.['email']">
      Invalid email address.
    </small>

  </div>

  <br><br>

  <label>Course ID</label>

  <input
    type="number"
    name="courseId"
    [(ngModel)]="courseId"
    required
    #courseCtrl="ngModel">

  <div *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">

    <small>Course ID is required.</small>

  </div>

  <br><br>

  <label>Preferred Semester</label>

  <select
    name="preferredSemester"
    [(ngModel)]="preferredSemester">

    <option value="">Select Semester</option>
    <option value="Odd">Odd</option>
    <option value="Even">Even</option>

  </select>

  <br><br>

  <label>

    <input
      type="checkbox"
      name="agreeToTerms"
      [(ngModel)]="agreeToTerms"
      required
      #termsCtrl="ngModel">

    I agree to the Terms & Conditions

  </label>

  <div *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">

    <small>You must accept the terms.</small>

  </div>

  <br><br>

  <button
    type="submit"
    [disabled]="enrollForm.invalid">

    Submit

  </button>

  <button
    type="button"
    (click)="resetForm(enrollForm)">

    Reset

  </button>

</form>

<div class="success" *ngIf="submitted">

  Enrollment request submitted successfully!

</div>
