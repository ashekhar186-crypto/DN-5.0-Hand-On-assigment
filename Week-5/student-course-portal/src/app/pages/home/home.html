<app-course-banner
  [portalName]="portalName"
  (bannerClicked)="onBannerClicked()">
</app-course-banner>

<h1>{{ portalName }}</h1>

<p>
  Manage your courses, monitor your academic progress and access student
  resources from one place.
</p>

<div class="stats">
  <div class="card">
    <h3>Courses Available</h3>
    <p>12</p>
  </div>

  <div class="card">
    <h3>Enrolled</h3>
    <p>3</p>
  </div>

  <div class="card">
    <h3>GPA</h3>
    <p>3.8</p>
  </div>
</div>

<br>

<button [disabled]="!isPortalActive" (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<br>

<label>Search Course:</label>

<input
  type="text"
  [(ngModel)]="searchTerm"
  placeholder="Enter course name"
/>

<p>Searching for: {{ searchTerm }}</p>
